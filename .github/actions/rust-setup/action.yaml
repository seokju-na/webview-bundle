name: "rust setup"
description: "rust setup"
inputs:
  components:
    description: "Comma-separated list of additional components to install."
    required: false
  targets:
    description: "Comma-separated list of additional targets to install."
    required: false
  cache-key:
    description: "Extra Cargo cache key (empty disables caching). Toolchain and dependency hashes are added automatically."
    required: false
  cache-workspaces:
    description: "Cargo workspace -> target directory mappings, separated by newlines."
    required: false
    default: ". -> target"
runs:
  using: "composite"
  steps:
    - name: Install rust
      id: install-rust
      uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      with:
        toolchain: 1.91.0
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - name: Cache cargo
      id: cache-cargo
      if: ${{ inputs.cache-key != '' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.cache-workspaces }}
        cache-directories: |
          ~/.napi-rs
          .cargo-cache
